name: Build APK (arm64-v8a)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install NDK 28.2
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager | head -1)
          yes | "$SDKMANAGER" "ndk;28.2.13676358"

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK (arm64-v8a)
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --build-name="${GITHUB_REF_NAME#v}" \
            --build-number="$(date +%s)"

      - name: Definir nome e link do APK
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            APK_NAME="ml-${GITHUB_REF_NAME}.apk"
            RELEASE_TAG="${GITHUB_REF_NAME}"
          else
            APK_NAME="ml-dev.apk"
            RELEASE_TAG="latest"
          fi
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "APK_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_NAME}" >> "$GITHUB_ENV"

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/*arm64-v8a*.apk "$APK_NAME" && ls -la "$APK_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ML (${{ github.ref_type == 'tag' && github.ref_name || 'latest' }})
          body: |
            [**Baixar APK**](${{ env.APK_URL }})

            Build automático a partir do commit `${{ github.sha }}`.
            APK Flutter **arm64-v8a** (release).
          files: ${{ env.APK_NAME }}
          overwrite: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
