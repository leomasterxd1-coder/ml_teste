name: Build APK (arm64-v8a)

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install NDK 28.2
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager | head -1)
          yes | "$SDKMANAGER" "ndk;28.2.13676358"

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK (arm64-v8a)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/*arm64-v8a*.apk minhaloja-flutter-teste.apk && ls -la minhaloja-flutter-teste.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: minhaloja-flutter-teste-apk
          path: minhaloja-flutter-teste.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: minhaloja-flutter-teste.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
