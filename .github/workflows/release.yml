name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install matching NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager | head -1)
          echo "y" | "$SDKMANAGER" "ndk;28.2.13676358"

      - name: Shorebird release (APK arm64, OTA pronto)
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          shorebird doctor
          shorebird release android \
            --artifact=apk \
            --target-platform android-arm64 \
            --flutter-version=3.38.5 \
            -- --dart-define=CLIENT_SECRET=$CLIENT_SECRET --no-tree-shake-icons

      - name: Publicar changelog nas notes do Shorebird
        if: success()
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: dart run scripts/update_shorebird_notes.dart

      - name: Renomear APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/minhaloja_flutter.apk && ls -la build/app/outputs/flutter-apk/minhaloja_flutter.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: minhaloja_flutter-apk
          path: build/app/outputs/flutter-apk/minhaloja_flutter.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/minhaloja_flutter.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}