name: Shorebird Patch OTA

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'

      - name: Install dependencies
        run: flutter pub get

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install matching NDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -name sdkmanager | head -1)
          echo "y" | "$SDKMANAGER" "ndk;28.2.13676358"

      - name: Shorebird patch (OTA para Android)
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          shorebird patch android \
            --release-version=latest \
            -- --dart-define=CLIENT_SECRET=$CLIENT_SECRET --no-tree-shake-icons

      - name: Publicar changelog nas notes do Shorebird
        if: success()
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        run: dart run scripts/update_shorebird_notes.dart