name: minhaloja
description: "Port fiel do app Android MLoja para Flutter."
publish_to: 'none'

version: 1.1.122+122

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  webview_flutter: ^4.4.2
  mobile_scanner: ^4.0.0
  provider: ^6.1.1
  image: ^4.1.0
  image_picker: ^1.0.7
  pdf: ^3.11.1
  barcode: ^2.2.4
  share_plus: ^7.2.2
  url_launcher: ^6.3.0
  flutter_slidable: ^3.1.0
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/overlays/

  fonts:
    - family: HelveticaNeueCondensed
      fonts:
        - asset: assets/fonts/HelveticaNeueCondensed.otf
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Bold.ttf
    - family: SFProDisplay
      fonts:
        - asset: assets/fonts/SFProDisplay-Regular.otf
          weight: 400
        - asset: assets/fonts/SFProDisplay-Bold.otf
          weight: 700
